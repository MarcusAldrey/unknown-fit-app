<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Logo K fitness</title>
  <desc id="desc">Letra K geométrica laranja acompanhada por três barras que remetem a anilhas de halter.</desc>

  <!-- Cor principal: #FF6634 -->
  <g fill="#FF6634">
    <!-- Anilhas: separadas do K -->
    <rect x="95"  y="285" width="28" height="130" rx="12"/>
    <rect x="145" y="235" width="38" height="230" rx="13"/>
    <rect x="205" y="175" width="52" height="350" rx="14"/>

    <!-- K geométrico -->
    <path d="
      M 290 110
      H 410
      V 300
      L 590 110
      H 735
      L 505 350
      L 735 590
      H 590
      L 410 400
      V 590
      H 290
      Z
    "/>
  </g>
</svg>
